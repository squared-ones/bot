name: Release worker apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS runner: `codesign` is available natively for ad-hoc signing the
    # macOS executables (Linux cannot produce valid signatures), and pkg
    # cross-compiles the Windows .exe and Linux binaries from here too.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build worker executables
        # Bundles the worker with all deps, compiles all 5 platform targets,
        # ad-hoc signs the macOS binaries, and wraps everything in .zip /
        # .tar.gz archives under dist/worker-release/.
        run: npm run package:worker -- --codesign

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/worker-release/*.zip, dist/worker-release/*.tar.gz
          generate_release_notes: true