name: Release worker apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag for manual runs (e.g. v1.0.1)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    # macOS runner: `codesign` is available natively for ad-hoc signing the
    # macOS executables (Linux cannot produce valid signatures), and pkg
    # cross-compiles the Windows .exe and Linux binaries from here too.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build worker executables
        # Bundles the worker with all deps, compiles all 5 platform targets,
        # ad-hoc signs the macOS binaries, and wraps everything in .zip /
        # .tar.gz archives under dist/worker-release/.
        run: npm run package:worker -- --codesign

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushes use the pushed tag; manual runs use the version input.
          # If the tag doesn't exist yet, GitHub creates it at this commit.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          files: dist/worker-release/*.zip, dist/worker-release/*.tar.gz
          generate_release_notes: true