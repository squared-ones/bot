<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squared One — Translate</title>
    <meta
      name="description"
      content="Help translate Squared One into your language. Human-reviewed translations — earn SQ for every approved string."
    />
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <script src="/js/loader.js"></script>
    <script src="/js/cookie-banner.js"></script>
    <script src="/js/cursor.js"></script>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div id="site-header"></div>

    <main class="tr-main">
      <section class="tr-hero">
        <span class="eyebrow">
          <span class="eyebrow-label">//</span>
          <span>Community translations</span>
        </span>
        <h1 class="hero-title">Speak every language<span class="cursor" aria-hidden="true"></span></h1>
        <p class="hero-sub">
          Help make Squared One multilingual. Every entry is written by a human
          and reviewed by a human — no machine translation.
        </p>
        <div class="tr-reward" id="tr-reward">Loading reward…</div>
      </section>

      <p class="tr-notice" id="tr-notice">
        Sign in to contribute translations.
      </p>

      <div class="tr-controls">
        <select id="tr-locale" aria-label="Target language"></select>
        <input id="tr-filter" type="text" placeholder="Filter strings…" autocomplete="off" />
      </div>

      <div class="tr-list" id="tr-list"></div>

      <section class="tr-pending" id="tr-pending" hidden>
        <h2 class="tr-h2">Pending review</h2>
        <div id="tr-pending-list"></div>
      </section>
    </main>

    <div id="site-footer"></div>
    <script src="/js/site-chrome.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/language-switcher.js"></script>
    <script src="/js/particles.js"></script>
    <div class="tr-status" id="tr-status" role="status" aria-live="polite"></div>

    <script>
      (function () {
        'use strict';

        const $ = (sel) => document.querySelector(sel);
        const listEl = $('#tr-list');
        const localeEl = $('#tr-locale');
        const filterEl = $('#tr-filter');
        const pendingEl = $('#tr-pending');
        const pendingListEl = $('#tr-pending-list');
        const rewardEl = $('#tr-reward');
        const noticeEl = $('#tr-notice');
        const statusEl = $('#tr-status');

        let state = {
          catalog: {},
          locales: [],
          reward: 0,
          isOwner: false,
          signedIn: false,
          locale: 'fr',
          pending: [],
        };

        function showStatus(message) {
          statusEl.textContent = message;
          statusEl.classList.add('show');
          clearTimeout(showStatus._t);
          showStatus._t = setTimeout(() => statusEl.classList.remove('show'), 2600);
        }

        const esc = (s) =>
          String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

        async function post(url, body) {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'request failed');
          return data;
        }

        function renderStrings() {
          const q = filterEl.value.trim().toLowerCase();
          const entries = Object.entries(state.catalog).filter(
            ([key]) => !q || key.toLowerCase().includes(q)
          );
          if (!entries.length) {
            listEl.innerHTML = '<div class="tr-empty">No matching strings.</div>';
            return;
          }
          listEl.innerHTML = entries
            .map(
              ([key, source]) => `
                <div class="tr-row">
                  <div class="tr-row-top">
                    <span class="tr-key">${esc(key)}</span>
                  </div>
                  <div class="tr-source">${esc(source)}</div>
                  ${
                    state.signedIn
                      ? `<form class="tr-submit" data-key="${esc(key)}">
                          <input type="text" maxlength="1000" placeholder="Your ${esc(state.locale)} translation…" required />
                          <button type="submit" class="btn btn-primary btn-sm">Submit</button>
                        </form>`
                      : ''
                  }
                </div>`
            )
            .join('');

          if (state.signedIn) {
            listEl.querySelectorAll('.tr-submit').forEach((form) => {
              form.addEventListener('submit', async (event) => {
                event.preventDefault();
                const input = form.querySelector('input');
                const value = input.value.trim();
                if (!value) return;
                const btn = form.querySelector('button');
                btn.disabled = true;
                try {
                  await post('/api/i18n/submit', {
                    locale: state.locale,
                    key: form.dataset.key,
                    value,
                  });
                  input.value = '';
                  showStatus('Submitted for review — earns ' + state.reward + ' SQ when approved.');
                  await loadCatalog();
                } catch (error) {
                  showStatus(error.message);
                } finally {
                  btn.disabled = false;
                }
              });
            });
          }
        }

        function renderPending() {
          if (!state.isOwner || !state.pending.length) {
            pendingEl.hidden = true;
            return;
          }
          pendingEl.hidden = false;
          pendingListEl.innerHTML = state.pending
            .map(
              (entry) => `
                <div class="tr-pending-item">
                  <div class="tr-pending-meta">${esc(entry.locale)} · ${esc(entry.key)} · ${esc(entry.contributorId || 'anonymous')}</div>
                  <div class="tr-pending-value">${esc(entry.value)}</div>
                  <div class="tr-pending-actions">
                    <button type="button" class="btn btn-primary btn-sm" data-approve="${esc(entry.id)}">Approve</button>
                    <button type="button" class="btn btn-secondary btn-sm" data-reject="${esc(entry.id)}">Reject</button>
                  </div>
                </div>`
            )
            .join('');

          pendingListEl.querySelectorAll('[data-approve]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              try {
                const data = await post('/api/i18n/approve', { id: btn.dataset.approve });
                showStatus('Approved — ' + (data.reward || 0) + ' SQ granted to contributor.');
                await loadCatalog();
              } catch (error) {
                showStatus(error.message);
              }
            });
          });
          pendingListEl.querySelectorAll('[data-reject]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              try {
                await post('/api/i18n/reject', { id: btn.dataset.reject });
                showStatus('Rejected.');
                await loadCatalog();
              } catch (error) {
                showStatus(error.message);
              }
            });
          });
        }

        function render() {
          rewardEl.textContent = '+' + state.reward + ' SQ per approved string';
          noticeEl.innerHTML = state.signedIn
            ? 'No machine translation — every entry is reviewed by a human before it ships.'
            : 'Please <a href="/login" style="color:var(--red)">sign in</a> to contribute translations.';
          renderStrings();
          renderPending();
        }

        async function loadCatalog() {
          try {
            const res = await fetch('/api/i18n/catalog');
            if (!res.ok) throw new Error('unauthorized');
            const data = await res.json();
            state.catalog = data.catalog || {};
            state.pending = data.pending || [];
            state.reward = Number(data.reward) || 0;
            state.isOwner = Boolean(data.isOwner);
            state.signedIn = Boolean(data.signedIn);
            if (data.locale) state.locale = data.locale;
            setLocaleSelect();
            render();
          } catch {
            state.signedIn = false;
            state.isOwner = false;
            render();
          }
        }

        function setLocaleSelect() {
          localeEl.innerHTML = state.locales
            .map(
              (l) =>
                `<option value="${esc(l)}"${l === state.locale ? ' selected' : ''}>${esc(l)}</option>`
            )
            .join('');
        }

        async function loadLocales() {
          try {
            const res = await fetch('/api/i18n/locales');
            const data = await res.json();
            state.locales = data.locales || [];
            state.reward = Number(data.reward) || state.reward;
            setLocaleSelect();
          } catch {
            /* ignore */
          }
        }

        localeEl.addEventListener('change', () => {
          state.locale = localeEl.value;
          renderStrings();
        });
        filterEl.addEventListener('input', renderStrings);

        loadLocales().then(loadCatalog);
      })();
    </script>
  </body>
</html>
