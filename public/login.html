<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Squared One</title>
    <meta name="description" content="Sign in with Discord to manage Squared One." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .login-wrap {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .login-card {
        position: relative;
        width: 100%;
        max-width: 400px;
        padding: 48px 40px 44px;
        background: var(--panel);
        border: 1px solid var(--red-dim);
      }

      .login-card::before,
      .login-card::after,
      .login-card .corner-br,
      .login-card .corner-bl {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: var(--red);
        border-style: solid;
        pointer-events: none;
      }

      .login-card::before {
        top: -1px;
        left: -1px;
        border-width: 2px 0 0 2px;
      }

      .login-card::after {
        top: -1px;
        right: -1px;
        border-width: 2px 2px 0 0;
      }

      .login-card .corner-br {
        bottom: -1px;
        right: -1px;
        border-width: 0 2px 2px 0;
      }

      .login-card .corner-bl {
        bottom: -1px;
        left: -1px;
        border-width: 0 0 2px 2px;
      }

      .login-logo {
        display: block;
        width: 84px;
        height: 84px;
        margin: 0 auto 22px;
        object-fit: contain;
      }

      .login-title {
        font-family: var(--mono);
        font-size: clamp(1.3rem, 4vw, 1.6rem);
        font-weight: 600;
        color: var(--red);
        text-shadow: 0 0 8px var(--red-glow);
        letter-spacing: 3px;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 10px;
        min-height: 2.2rem;
      }

      .login-title .cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        background: var(--red);
        margin-left: 3px;
        vertical-align: middle;
        box-shadow: 0 0 8px var(--red-glow);
        animation: blink 1s step-end infinite;
      }

      .login-sub {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: rgba(255, 60, 60, 0.5);
        letter-spacing: 4px;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 34px;
      }

      .login-error {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: #ff5555;
        letter-spacing: 1px;
        text-align: center;
        margin-bottom: 18px;
        display: none;
      }

      .login-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
      }

      .discord-mark {
        display: inline-block;
        width: 20px;
        height: 20px;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.14 96.36"><path fill="%23ffffff" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>')
          no-repeat center;
        background-size: contain;
      }

      .login-hint {
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--muted);
        letter-spacing: 1px;
        text-align: center;
        margin-top: 22px;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 36px 24px 32px;
        }
        .login-title {
          letter-spacing: 2px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div class="login-wrap">
      <div class="login-card" id="card">
        <span class="corner-br" aria-hidden="true"></span>
        <span class="corner-bl" aria-hidden="true"></span>

        <img class="login-logo" src="/logo.png" alt="Squared One logo" />
        <h1 class="login-title" id="heading"><span class="cursor" id="cur"></span></h1>
        <p class="login-sub">Secure access</p>

        <div class="login-error" id="error-display"></div>

        <a href="/auth/discord/login" class="btn btn-primary login-btn">
          <span class="discord-mark"></span>
          Login with Discord
        </a>

        <p class="login-hint">Sign in to manage rules and server tools.</p>
      </div>
    </div>

    <script>
      // Typing effect for the title.
      (function () {
        const text = 'SQUARED ONE';
        const el = document.getElementById('heading');
        const cursor = document.getElementById('cur');
        let i = 0;
        function tick() {
          if (i < text.length) {
            el.insertBefore(document.createTextNode(text[i]), cursor);
            i++;
            setTimeout(tick, 80);
          }
        }
        tick();
      })();

      // OAuth error from ?error=…
      (function () {
        const params = new URLSearchParams(window.location.search);
        const err = params.get('error');
        if (err) {
          const el = document.getElementById('error-display');
          el.textContent = decodeURIComponent(err);
          el.style.display = 'block';
          const card = document.getElementById('card');
          card.classList.add('shake');
        }
      })();

      // Particle background.
      (function () {
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let W, H;
        function resize() {
          W = canvas.width = window.innerWidth;
          H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Dot {
          constructor() { this.reset(); }
          reset() {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
            this.r = Math.random() * 1.5 + 0.5;
          }
          step() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > W) this.vx *= -1;
            if (this.y < 0 || this.y > H) this.vy *= -1;
          }
        }

        const DOTS = Array.from({ length: 55 }, () => new Dot());

        function frame() {
          ctx.fillStyle = 'rgba(5,0,0,0.22)';
          ctx.fillRect(0, 0, W, H);
          DOTS.forEach((d) => d.step());
          for (let i = 0; i < DOTS.length; i++) {
            for (let j = i + 1; j < DOTS.length; j++) {
              const dx = DOTS[i].x - DOTS[j].x;
              const dy = DOTS[i].y - DOTS[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 110) {
                ctx.strokeStyle = `rgba(255,0,0,${(1 - dist / 110) * 0.35})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(DOTS[i].x, DOTS[i].y);
                ctx.lineTo(DOTS[j].x, DOTS[j].y);
                ctx.stroke();
              }
            }
            ctx.fillStyle = 'rgba(255,0,0,0.25)';
            ctx.beginPath();
            ctx.arc(DOTS[i].x, DOTS[i].y, DOTS[i].r, 0, Math.PI * 2);
            ctx.fill();
          }
          if (!reduced) requestAnimationFrame(frame);
        }
        frame();
      })();
    </script>
  </body>
</html>
