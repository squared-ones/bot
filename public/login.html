<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Squared One</title>
    <meta name="description" content="Sign in to Squared One with your account or Discord." />
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <script src="/js/loader.js"></script>
    <script src="/js/cookie-banner.js"></script>
    <script src="/js/cursor.js"></script>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div class="login-wrap">
      <div class="login-card" id="card">
        <span class="corner-br" aria-hidden="true"></span>
        <span class="corner-bl" aria-hidden="true"></span>

        <img class="login-logo" src="/img/logo.png" alt="Squared One logo" />
        <h1 class="login-title" id="heading"><span class="cursor" id="cur"></span></h1>
        <p class="login-sub">Secure access</p>

        <div class="login-error" id="error-display"></div>

        <form class="login-form" id="login-form" autocomplete="off">
          <label class="login-field">
            <span class="field-label">Username</span>
            <input class="login-input" id="login-username" type="text" maxlength="32" autocomplete="username" required />
          </label>
          <label class="login-field">
            <span class="field-label">Password</span>
            <input class="login-input" id="login-password" type="password" maxlength="128" autocomplete="current-password" required />
          </label>
          <button type="submit" class="btn btn-primary login-btn">Sign in</button>
        </form>

        <div class="login-divider">or</div>

        <a href="/auth/discord/login" class="btn btn-secondary login-btn" id="discord-login">
          <span class="discord-mark"></span>
          Login with Discord
        </a>

        <p class="login-links">
          <span>New here?</span>
          <a href="/signup">Create an account</a>
        </p>

        <p class="login-hint">Sign in to manage your servers and every Squared One feature.</p>
      </div>
    </div>

    <script>
      // Typing effect for the title.
      (function () {
        const text = 'SQUARED ONE';
        const el = document.getElementById('heading');
        const cursor = document.getElementById('cur');
        let i = 0;
        function tick() {
          if (i < text.length) {
            el.insertBefore(document.createTextNode(text[i]), cursor);
            i++;
            setTimeout(tick, 80);
          }
        }
        tick();
      })();

      function showError(message) {
        const el = document.getElementById('error-display');
        el.textContent = message;
        el.style.display = 'block';
        document.getElementById('card').classList.add('shake');
      }

      // Error passed back from a failed auth redirect (?error=…).
      (function () {
        const params = new URLSearchParams(window.location.search);
        const err = params.get('error');
        if (err) showError(decodeURIComponent(err));
      })();

      // Hide the Discord button when OAuth isn't configured.
      (function () {
        fetch('/api/auth/methods')
          .then((res) => res.json())
          .then((data) => {
            if (!data.discord) {
              document.getElementById('discord-login').style.display = 'none';
            }
          })
          .catch(() => {});
      })();

      // Username/password sign-in.
      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const submit = event.target.querySelector('button[type="submit"]');
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        if (!username || !password) return;

        submit.disabled = true;
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            showError(data.error || 'Sign-in failed.');
            return;
          }
          window.location.href = '/dashboard';
        } catch {
          showError('Sign-in failed. Please try again.');
        } finally {
          submit.disabled = false;
        }
      });

    </script>
    <script src="/js/particles.js"></script>
  </body>
</html>
