<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squared One — Verify</title>
    <meta name="description" content="Complete verification for Squared One." />
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <script src="/js/loader.js"></script>
    <script src="/js/cookie-banner.js"></script>
    <script src="/js/cursor.js"></script>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div id="site-header"></div>

    <main class="verify-main">
      <div class="verify-card">
        <span class="corner-br" aria-hidden="true"></span>
        <span class="corner-bl" aria-hidden="true"></span>
        <h1 class="verify-title">Verify<span class="cursor" aria-hidden="true"></span></h1>
        <p class="verify-sub">SECURE ACCESS</p>
        <div class="verify-status" id="verify-status">
          <p>Loading…</p>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>
    <script src="/js/site-chrome.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/language-switcher.js"></script>

    <script src="/js/particles.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const guild = (params.get('guild') || '').trim();
        const statusEl = document.getElementById('verify-status');
        let captchaId = null;

        const esc = (s) =>
          String(s).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
          })[c]);

        function set(html) {
          statusEl.innerHTML = html;
        }

        function signIn() {
          const next = '/verify?guild=' + encodeURIComponent(guild);
          set(
            `<p>Sign in with Discord to continue.</p>` +
              `<a class="btn btn-primary verify-btn" href="/auth/discord/login?next=${encodeURIComponent(
                next
              )}">Sign in with Discord</a>`
          );
        }

        function message(cls, text) {
          set(`<p class="${cls}">${esc(text)}</p>`);
        }

        async function submit() {
          const input = document.getElementById('captcha-answer');
          const answer = input.value.trim();
          if (!answer) return;
          const btn = document.getElementById('verify-submit');
          btn.disabled = true;
          btn.textContent = 'Verifying…';
          try {
            const res = await fetch('/api/verify/complete', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ guild, captchaId, answer }),
            });
            const data = await res.json().catch(() => ({}));
            if (res.status === 401) return signIn();
            if (!res.ok) {
              message('verify-err', data.error || 'Verification failed.');
              showCaptcha();
              return;
            }
            set(`<p class="verify-ok">✅ You're verified! You can close this tab.</p>`);
          } catch {
            message('verify-err', 'Connection error. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Verify';
          }
        }

        async function showCaptcha() {
          try {
            const res = await fetch(
              '/api/verify/captcha?guild=' + encodeURIComponent(guild)
            );
            if (res.status === 401) return signIn();
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              message('verify-err', data.error || 'Could not load captcha.');
              return;
            }
            captchaId = data.id;
            set(
              `<p>Enter the code below to verify.</p>` +
                `<div class="captcha-box">${data.svg}</div>` +
                `<input class="captcha-input" id="captcha-answer" type="text" maxlength="8" placeholder="CODE" autocomplete="off" />` +
                `<button class="btn btn-primary verify-btn" id="verify-submit" type="button">Verify</button>` +
                `<p class="verify-hint">Not clear? <a href="#" id="captcha-refresh">Refresh</a></p>`
            );
            const input = document.getElementById('captcha-answer');
            input.focus();
            input.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') submit();
            });
            document.getElementById('captcha-refresh').addEventListener('click', (e) => {
              e.preventDefault();
              showCaptcha();
            });
            document.getElementById('verify-submit').addEventListener('click', submit);
          } catch {
            message('verify-err', 'Failed to load captcha. Please try again.');
          }
        }

        async function init() {
          if (!guild) {
            message('verify-err', 'Missing server ID — use the link from the /verify command.');
            return;
          }
          try {
            const res = await fetch(
              '/api/verify/status?guild=' + encodeURIComponent(guild)
            );
            if (res.status === 401) return signIn();
            const data = await res.json();
            if (!data.signedIn) return signIn();
            if (!data.configured || !data.roleRequired) {
              return message('verify-err', 'Verification is not configured for this server.');
            }
            if (!data.member) {
              return message(
                'verify-err',
                'You are not a member of ' + (data.guildName || 'this server') + '.'
              );
            }
            if (data.networkBlocked) {
              return message(
                'verify-err',
                'VPN, proxy, Tor, or a known datacenter network was detected. Disable it and try again.'
              );
            }
            if (data.verified === true) {
              return set(`<p class="verify-ok">✅ You're already verified!</p>`);
            }
            if (data.verified === null) {
              return message(
                'verify-err',
                'The bot is offline. Please try again shortly.'
              );
            }
            showCaptcha();
          } catch {
            message('verify-err', 'Failed to check your status. Please try again.');
          }
        }

        init();
      })();
    </script>
  </body>
</html>
