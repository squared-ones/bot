<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — Squared One</title>
    <meta name="description" content="Create a Squared One account to manage your Discord servers." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .signup-wrap {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .signup-card {
        position: relative;
        width: 100%;
        max-width: 400px;
        padding: 48px 40px 44px;
        background: var(--panel);
        border: 1px solid var(--red-dim);
      }

      .signup-card::before,
      .signup-card::after,
      .signup-card .corner-br,
      .signup-card .corner-bl {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: var(--red);
        border-style: solid;
        pointer-events: none;
      }

      .signup-card::before {
        top: -1px;
        left: -1px;
        border-width: 2px 0 0 2px;
      }

      .signup-card::after {
        top: -1px;
        right: -1px;
        border-width: 2px 2px 0 0;
      }

      .signup-card .corner-br {
        bottom: -1px;
        right: -1px;
        border-width: 0 2px 2px 0;
      }

      .signup-card .corner-bl {
        bottom: -1px;
        left: -1px;
        border-width: 0 0 2px 2px;
      }

      .signup-logo {
        display: block;
        width: 84px;
        height: 84px;
        margin: 0 auto 22px;
        object-fit: contain;
      }

      .signup-title {
        font-family: var(--mono);
        font-size: clamp(1.3rem, 4vw, 1.6rem);
        font-weight: 600;
        color: var(--red);
        text-shadow: 0 0 8px var(--red-glow);
        letter-spacing: 3px;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 10px;
        min-height: 2.2rem;
      }

      .signup-title .cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        background: var(--red);
        margin-left: 3px;
        vertical-align: middle;
        box-shadow: 0 0 8px var(--red-glow);
        animation: blink 1s step-end infinite;
      }

      .signup-sub {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: rgba(255, 60, 60, 0.5);
        letter-spacing: 4px;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 34px;
      }

      .signup-error {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: #ff5555;
        letter-spacing: 1px;
        text-align: center;
        margin-bottom: 18px;
        display: none;
      }

      .signup-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .signup-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .signup-field label {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
      }

      .signup-input {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--red-dim);
        color: var(--text);
        font-family: var(--mono);
        font-size: 0.9rem;
        padding: 11px 12px;
        outline: none;
        transition: border-color 0.2s;
      }

      .signup-input:focus {
        border-color: var(--red);
        box-shadow: 0 0 0 1px var(--red-glow);
      }

      .signup-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .signup-help {
        font-family: var(--mono);
        font-size: 0.66rem;
        color: var(--muted);
        letter-spacing: 1px;
        line-height: 1.5;
      }

      .signup-links {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 22px;
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 1px;
        color: var(--muted);
      }

      .signup-links a {
        color: var(--red);
        text-decoration: none;
      }

      .signup-links a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .signup-card {
          padding: 36px 24px 32px;
        }
        .signup-title {
          letter-spacing: 2px;
        }
      }
    </style>
  </head>
  <body>
    <script src="/loader.js"></script>
    <script src="/cookie-banner.js"></script>
    <script src="/cursor.js"></script>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div class="signup-wrap">
      <div class="signup-card" id="card">
        <span class="corner-br" aria-hidden="true"></span>
        <span class="corner-bl" aria-hidden="true"></span>

        <img class="signup-logo" src="/logo.png" alt="Squared One logo" />
        <h1 class="signup-title" id="heading"><span class="cursor" id="cur"></span></h1>
        <p class="signup-sub">Create your account</p>

        <div class="signup-error" id="error-display"></div>

        <form class="signup-form" id="signup-form" autocomplete="off">
          <label class="signup-field">
            <span class="field-label">Username</span>
            <input class="signup-input" id="signup-username" type="text" maxlength="32" autocomplete="username" required />
          </label>
          <label class="signup-field">
            <span class="field-label">Password</span>
            <input class="signup-input" id="signup-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required />
          </label>
          <label class="signup-field">
            <span class="field-label">Confirm password</span>
            <input class="signup-input" id="signup-confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required />
          </label>
          <p class="signup-help">3–32 characters (letters, numbers, underscores) for your username, 8+ characters for your password. You can link Discord later from the dashboard.</p>
          <button type="submit" class="btn btn-primary signup-btn">Create account</button>
        </form>

        <p class="signup-links">
          <span>Already have an account?</span>
          <a href="/login">Sign in</a>
        </p>
      </div>
    </div>

    <script>
      // Typing effect for the title.
      (function () {
        const text = 'SQUARED ONE';
        const el = document.getElementById('heading');
        const cursor = document.getElementById('cur');
        let i = 0;
        function tick() {
          if (i < text.length) {
            el.insertBefore(document.createTextNode(text[i]), cursor);
            i++;
            setTimeout(tick, 80);
          }
        }
        tick();
      })();

      function showError(message) {
        const el = document.getElementById('error-display');
        el.textContent = message;
        el.style.display = 'block';
        document.getElementById('card').classList.add('shake');
      }

      document.getElementById('signup-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const submit = event.target.querySelector('button[type="submit"]');
        const username = document.getElementById('signup-username').value.trim();
        const password = document.getElementById('signup-password').value;
        const confirm = document.getElementById('signup-confirm').value;

        if (password !== confirm) {
          showError('Passwords do not match.');
          return;
        }

        submit.disabled = true;
        try {
          const res = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            showError(data.error || 'Signup failed.');
            return;
          }
          window.location.href = '/dashboard';
        } catch {
          showError('Signup failed. Please try again.');
        } finally {
          submit.disabled = false;
        }
      });

      // Particle background.
      (function () {
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let W, H;
        function resize() {
          W = canvas.width = window.innerWidth;
          H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Dot {
          constructor() { this.reset(); }
          reset() {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
            this.r = Math.random() * 1.5 + 0.5;
          }
          step() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > W) this.vx *= -1;
            if (this.y < 0 || this.y > H) this.vy *= -1;
          }
        }

        const DOTS = Array.from({ length: 55 }, () => new Dot());

        function frame() {
          ctx.fillStyle = 'rgba(5,0,0,0.22)';
          ctx.fillRect(0, 0, W, H);
          DOTS.forEach((d) => d.step());
          for (let i = 0; i < DOTS.length; i++) {
            for (let j = i + 1; j < DOTS.length; j++) {
              const dx = DOTS[i].x - DOTS[j].x;
              const dy = DOTS[i].y - DOTS[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 110) {
                ctx.strokeStyle = `rgba(255,0,0,${(1 - dist / 110) * 0.35})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(DOTS[i].x, DOTS[i].y);
                ctx.lineTo(DOTS[j].x, DOTS[j].y);
                ctx.stroke();
              }
            }
            ctx.fillStyle = 'rgba(255,0,0,0.25)';
            ctx.beginPath();
            ctx.arc(DOTS[i].x, DOTS[i].y, DOTS[i].r, 0, Math.PI * 2);
            ctx.fill();
          }
          if (!reduced) requestAnimationFrame(frame);
        }
        frame();
      })();
    </script>
  </body>
</html>
