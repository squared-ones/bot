<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found // Squared One</title>
    <meta name="description" content="Page not found — Squared One." />
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <script src="/js/loader.js"></script>
    <script src="/js/cookie-banner.js"></script>
    <script src="/js/cursor.js"></script>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div id="site-header"></div>

    <div class="nf-wrap">
      <div class="nf-code">404</div>
      <div class="nf-msg">Page not found</div>

      <div class="nf-term">
        <div class="nf-term-bar">
          <i></i><i></i><i></i>
          <span class="nf-term-title">squared-one</span>
        </div>
        <div class="nf-term-body">
          <span class="dim">$</span> curl <span class="path nf-path" id="nf-path">/</span><br />
          <span class="err">Error 404</span> — resource not found.<br />
          <span class="dim">The requested route does not exist on this node.</span><br />
          <span class="dim">$</span> <a href="/">cd ~/dashboard</a>
        </div>
      </div>

      <a href="/" class="btn btn-primary"><span class="btn-glyph">←</span> Back to dashboard</a>
    </div>

    <div id="site-footer"></div>
    <script src="/js/site-chrome.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/language-switcher.js"></script>
    <script src="/js/particles.js"></script>
    <script>
      document.getElementById('nf-path').textContent =
        window.location.pathname || '/';
    </script>
  </body>
