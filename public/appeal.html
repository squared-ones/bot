<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squared One — Ban Appeal</title>
    <meta
      name="description"
      content="Appeal a ban from a Squared One server."
    />
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <script src="/js/loader.js"></script>
    <script src="/js/cookie-banner.js"></script>
    <script src="/js/cursor.js"></script>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div id="site-header"></div>

    <main class="appeal-main">
      <section class="appeal-hero">
        <span class="eyebrow">
          <span class="eyebrow-label">//</span>
          <span>Ban appeal</span>
        </span>
        <h1 class="hero-title">Appeal a ban<span class="cursor" aria-hidden="true"></span></h1>
        <p class="hero-sub">
          Banned from a Squared One server? Tell us what happened and a
          moderator will review your appeal.
        </p>
      </section>

      <div class="appeal-card">
        <span class="corner-br" aria-hidden="true"></span>
        <span class="corner-bl" aria-hidden="true"></span>

        <div class="appeal-result" id="appeal-result"></div>

        <form class="appeal-form" id="appeal-form" autocomplete="off">
          <label class="field">
            <span class="field-label">Server</span>
            <select id="appeal-server" required></select>
          </label>

          <label class="field">
            <span class="field-label">Discord username</span>
            <input
              id="appeal-username"
              type="text"
              maxlength="100"
              placeholder="e.g. squally"
              required
            />
          </label>

          <label class="field">
            <span class="field-label">Discord user ID (recommended)</span>
            <input
              id="appeal-userid"
              type="text"
              maxlength="22"
              inputmode="numeric"
              placeholder="Find it in Discord → Settings → Advanced → Developer Mode"
            />
          </label>

          <label class="field">
            <span class="field-label">Why should you be unbanned?</span>
            <textarea
              id="appeal-reason"
              rows="5"
              maxlength="2000"
              placeholder="Explain what happened and why you'd like to return."
              required
            ></textarea>
          </label>

          <button type="submit" class="btn btn-primary" id="appeal-submit">
            Submit appeal
          </button>
        </form>

        <p class="appeal-help">
          Appeals are private and only visible to server moderators. You can
          also appeal by DMing the bot with <code>/appeal</code>.
        </p>
      </div>
    </main>

    <div id="site-footer"></div>
    <script src="/js/site-chrome.js"></script>
    <script src="/js/footer.js"></script>

    <script src="/js/particles.js"></script>
    <script>
      const serverSelect = document.getElementById('appeal-server');
      const form = document.getElementById('appeal-form');
      const result = document.getElementById('appeal-result');
      const submit = document.getElementById('appeal-submit');

      function showResult(message, kind) {
        result.textContent = message;
        result.className = 'appeal-result ' + (kind === 'error' ? 'error' : '');
        result.style.display = 'block';
      }

      fetch('/api/servers')
        .then((r) => r.json())
        .then((data) => {
          const servers = (data && data.servers) || [];
          if (!servers.length) {
            const option = document.createElement('option');
            option.value = '';
            option.textContent =
              'No servers available — the bot may be offline.';
            serverSelect.appendChild(option);
            serverSelect.disabled = true;
            submit.disabled = true;
            return;
          }
          for (const server of servers) {
            const option = document.createElement('option');
            option.value = server.id;
            option.textContent = server.name;
            serverSelect.appendChild(option);
          }
        })
        .catch(() => {
          const option = document.createElement('option');
          option.value = '';
          option.textContent = 'Failed to load servers.';
          serverSelect.appendChild(option);
          serverSelect.disabled = true;
          submit.disabled = true;
        });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const guildId = serverSelect.value;
        const username = document.getElementById('appeal-username').value.trim();
        const userId = document.getElementById('appeal-userid').value.trim();
        const reason = document.getElementById('appeal-reason').value.trim();
        if (!guildId || !reason) return;

        submit.disabled = true;
        try {
          const res = await fetch('/api/appeals', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ guildId, username, userId, reason }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.error || 'Failed to submit your appeal.');
          }
          showResult(
            '✅ Appeal submitted (ID ' + data.id + '). Moderators will review it soon.',
            'ok'
          );
          form.reset();
        } catch (error) {
          showResult('❌ ' + error.message, 'error');
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
